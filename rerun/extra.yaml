apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen4, namespace: default}
spec:
  replicas: 4
  selector: {matchLabels: {app: loadgen4}}
  template:
    metadata: {labels: {app: loadgen4}}
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:latest
        args: ["server"]
        resources: {requests: {cpu: 250m, memory: 128Mi}}
---
apiVersion: v1
kind: Namespace
metadata: {name: outside}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen-out, namespace: outside}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen-out}}
  template:
    metadata: {labels: {app: loadgen-out}, annotations: {linkerd.io/inject: disabled}}
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:latest
        args: ["server"]
        resources: {requests: {cpu: 500m, memory: 128Mi}}
