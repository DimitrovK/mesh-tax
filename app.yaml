apiVersion: v1
kind: ConfigMap
metadata: {name: nginxconf}
data:
  backend.conf: |
    server {
      listen 8080;
      access_log off;
      location / { return 200 'backend-ok'; add_header Content-Type text/plain; }
    }
  frontend.conf: |
    upstream be { server backend:8080; keepalive 64; }
    server {
      listen 8080;
      access_log off;
      location / {
        proxy_pass http://be/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  replicas: 2
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 200m, memory: 64Mi}}
        volumeMounts: [{name: c, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: c, configMap: {name: nginxconf, items: [{key: backend.conf, path: default.conf}]}}]
---
apiVersion: v1
kind: Service
metadata: {name: backend}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 200m, memory: 64Mi}}
        volumeMounts: [{name: c, mountPath: /etc/nginx/conf.d}]
      volumes: [{name: c, configMap: {name: nginxconf, items: [{key: frontend.conf, path: default.conf}]}}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend}
spec:
  selector: {app: frontend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      containers:
      - name: fortio
        image: fortio/fortio:latest
        args: ["server"]
        resources: {requests: {cpu: 500m, memory: 128Mi}}
